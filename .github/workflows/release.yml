name: Release

on:
  push:
    tags: ["v*"]
  # patch-update.yml la llama después de crear la etiqueta: una etiqueta
  # empujada con el token de la Action no dispara este workflow por sí sola
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci

      # Before the slow steps, so a release that would not compile fails in
      # under a minute rather than after packaging
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - run: npm run dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            dist/MayhemTracker.exe \
            --title "$TAG" \
            --generate-notes
